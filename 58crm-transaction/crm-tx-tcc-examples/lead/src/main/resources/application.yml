server:
  port: 8081

spring:
  application:
    name: lead-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

crm:
  tx:
    tcc:
      client:
        enabled: true
        coordinator-service-name: crm-tx-tcc-coordinator
        deadline-seconds: 15
      participant:
        enabled: false

quota:
  callback-endpoint: ${QUOTA_CALLBACK_ENDPOINT:127.0.0.1:9092}
