server:
  port: 0

spring:
  application:
    name: crm-tx-tcc-coordinator
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:crm_tx}?useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

crm:
  tx:
    tcc:
      coordinator:
        grpc-port: ${TCC_GRPC_PORT:9090}
