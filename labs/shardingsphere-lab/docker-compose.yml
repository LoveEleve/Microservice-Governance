services:
  mysql:
    image: mysql:8.0.33
    container_name: shardingsphere-lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
